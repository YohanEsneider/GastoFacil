<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastoFacil - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex justify-content-center align-items-center vh-100">
<div class="login-card">
    <div class="text-center mb-4">
        <div class="bg-primary d-inline-block p-3 rounded-4 mb-3 shadow-sm" style="background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-accent) 100%) !important;">
            <i class="bi bi-shop-window text-white fs-2"></i>
        </div>
        <h3 class="fw-bold">GastoFacil</h3>
        <p class="text-muted small">Ingresa a tu panel de control</p>
    </div>

    <form action="dashboard.html">
        <div class="mb-3">
            <label class="form-label small fw-bold">Correo Electrónico</label>
            <input type="email" class="form-control" placeholder="usuario@correo.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label small fw-bold">Contraseña</label>
            <input type="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-action w-100 mb-3">Ingresar</button>
        <div class="text-center">
            <p class="small text-muted">¿No tienes cuenta? <a href="registro.html" class="text-decoration-none fw-bold" style="color: var(--primary-blue);">Regístrate</a></p>
        </div>
    </form>
</div>
</div>

</body>
</html>
