<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastoFacil - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Habilita la entrada e interacción de texto en Electron */
        input, select, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
            pointer-events: auto !important;
            cursor: text !important;
        }

        /* Estilo para el contenedor del input de contraseña y el botón de ojo */
        .password-container {
            position: relative;
        }

        .btn-toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary, #64748B);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .btn-toggle-password:hover {
            color: var(--primary-blue, #3B82F6);
        }
    </style>

    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>

    <div class="position-absolute top-0 end-0 p-4">
        <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle theme">
            <i class="bi bi-sun-fill"></i>
        </button>
    </div>

    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="bg-primary d-inline-block p-3 rounded-4 mb-3 shadow-sm"
                    style="background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-accent) 100%) !important;">
                    <i class="bi bi-shop-window text-white fs-2"></i>
                </div>
                <h3 class="fw-bold">GastoFacil</h3>
                <p class="text-muted small">Ingresa a tu panel de control</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Correo o Usuario</label>
                    <input type="text" id="usuario" class="form-control" placeholder="Ingresa tu usuario o correo" required autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="password" class="form-control pe-5" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" id="btnTogglePassword" aria-label="Mostrar u ocultar contraseña">
                            <!-- Inicia con bi-eye-slash-fill porque la contraseña arranca OCULTA en puntos -->
                            <i class="bi bi-eye-slash-fill" id="iconEye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btnIngresar" class="btn btn-action w-100 mb-3">Ingresar</button>
                <div class="text-center">
                    <p class="small text-muted">¿No tienes cuenta? <a href="registro.html"
                            class="text-decoration-none fw-bold" style="color: var(--primary-blue);">Regístrate</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="api.js"></script>

    <script>
        // Funcionalidad para ocultar/mostrar contraseña
        document.getElementById('btnTogglePassword').addEventListener('click', function () {
            const inputPass = document.getElementById('password');
            const iconEye = document.getElementById('iconEye');

            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                // Ahora la contraseña ES VISIBLE -> mostramos el ojo abierto
                iconEye.classList.remove('bi-eye-slash-fill');
                iconEye.classList.add('bi-eye-fill');
            } else {
                inputPass.type = 'password';
                // Ahora la contraseña ESTÁ OCULTA (puntos) -> mostramos el ojo tachado
                iconEye.classList.remove('bi-eye-fill');
                iconEye.classList.add('bi-eye-slash-fill');
            }
        });

        // Envío del formulario
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const usuarioInput = document.getElementById('usuario').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const btnIngresar = document.getElementById('btnIngresar');

            btnIngresar.disabled = true;
            btnIngresar.innerText = 'Cargando...';

            try {
                const response = await fetch('http://localhost:8080/GastoFacilWeb/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        usuario: usuarioInput,
                        password: passwordInput
                    })
                });

                const data = await response.json();

                if (response.ok && data.estatus === "Exitoso") {
                    const idUsuarioVal = data.idUsuario || data.id_usuario || data.id;
                    const idTiendaVal = data.idTienda || data.id_tienda || idUsuarioVal;

                    localStorage.setItem('usuarioSesion', JSON.stringify(data));
                    localStorage.setItem('idUsuario', String(idUsuarioVal));
                    localStorage.setItem('idTienda', String(idTiendaVal));
                    localStorage.setItem('nombreUsuario', data.usuario || data.nombreUsuario || 'Usuario');

                    Swal.fire({
                        icon: 'success',
                        title: '¡Bienvenido ' + (data.usuario || data.nombreUsuario || '') + '!',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = 'dashboard.html';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error de acceso',
                        text: data.mensaje || 'Credenciales incorrectas'
                    });
                    btnIngresar.disabled = false;
                    btnIngresar.innerText = 'Ingresar';
                }
            } catch (error) {
                console.error('Error de red:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de conexión',
                    text: 'No se pudo conectar con el servidor Java (Tomcat).'
                });
                btnIngresar.disabled = false;
                btnIngresar.innerText = 'Ingresar';
            }
        });
    </script>
</body>

</html>
