<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastoFacil - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        input, select, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
            pointer-events: auto !important;
            cursor: text !important;
        }

        body {
            position: relative;
            overflow-x: hidden;
        }

        .bg-shape-1 {
            position: fixed;
            width: 500px;
            height: 500px;
            top: -120px;
            left: -120px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(139, 92, 246, 0.08) 70%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 1;
            animation: floatOrb 12s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .bg-shape-2 {
            position: fixed;
            width: 550px;
            height: 550px;
            bottom: -150px;
            right: -120px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.22) 0%, rgba(16, 185, 129, 0.08) 70%);
            filter: blur(90px);
            border-radius: 50%;
            z-index: 1;
            animation: floatOrb 15s ease-in-out infinite alternate-reverse;
            pointer-events: none;
        }

        html[data-theme="dark"] .bg-shape-1 {
            background: radial-gradient(circle, rgba(96, 165, 250, 0.3) 0%, rgba(167, 139, 250, 0.1) 70%);
        }

        html[data-theme="dark"] .bg-shape-2 {
            background: radial-gradient(circle, rgba(167, 139, 250, 0.25) 0%, rgba(52, 211, 153, 0.1) 70%);
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.1); }
        }

        .login-card {
            position: relative;
            z-index: 10;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .password-container {
            position: relative;
        }

        .btn-toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary, #64748B);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .btn-toggle-password:hover {
            color: var(--primary-blue, #3B82F6);
        }
    </style>

    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>

    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <div class="position-absolute top-0 end-0 p-4" style="z-index: 20;">
        <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle theme">
            <i class="bi bi-sun-fill"></i>
        </button>
    </div>

    <div class="d-flex justify-content-center align-items-center vh-100 position-relative" style="z-index: 10;">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="bg-primary d-inline-block p-3 rounded-4 mb-3 shadow-sm"
                    style="background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-accent) 100%) !important;">
                    <i class="bi bi-shop-window text-white fs-2"></i>
                </div>
                <h3 class="fw-bold">GastoFacil</h3>
                <p class="text-muted small">Ingresa a tu panel de control</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-uppercase text-secondary">Correo o Nombre de la Tienda</label>
                    <input type="text" id="usuario" class="form-control" placeholder="Ingresa tu correo o nombre de la tienda" required autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold text-uppercase text-secondary">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="password" class="form-control pe-5" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" id="btnTogglePassword" aria-label="Mostrar u ocultar contraseña">
                            <i class="bi bi-eye-slash-fill" id="iconEye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btnIngresar" class="btn btn-action w-100 mb-3">Ingresar</button>
                <div class="text-center">
                    <p class="small text-muted">¿No tienes cuenta? <a href="registro.html"
                            class="text-decoration-none fw-bold" style="color: var(--primary-blue);">Regístrate</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="api.js"></script>

    <script>
        document.getElementById('btnTogglePassword').addEventListener('click', function () {
            const inputPass = document.getElementById('password');
            const iconEye = document.getElementById('iconEye');

            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                iconEye.classList.remove('bi-eye-slash-fill');
                iconEye.classList.add('bi-eye-fill');
            } else {
                inputPass.type = 'password';
                iconEye.classList.remove('bi-eye-fill');
                iconEye.classList.add('bi-eye-slash-fill');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const usuarioInput = document.getElementById('usuario').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const btnIngresar = document.getElementById('btnIngresar');

            btnIngresar.disabled = true;
            btnIngresar.innerText = 'Cargando...';

            try {
                const data = await API.login(usuarioInput, passwordInput);

                Swal.fire({
                    icon: 'success',
                    title: '¡Bienvenido ' + (data.nombreUsuario || data.usuario || '') + '!',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'dashboard.html';
                });
            } catch (error) {
                console.error('Error de acceso:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de acceso',
                    text: error.message || 'Credenciales incorrectas'
                });
                btnIngresar.disabled = false;
                btnIngresar.innerText = 'Ingresar';
            }
        });
    </script>
</body>

</html>
