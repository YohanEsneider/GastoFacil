<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastoFacil - Historial de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>

    <aside class="sidebar">
        <div class="p-4 mb-4">
            <div class="d-flex align-items-center">
                <div class="bg-primary p-2 rounded-3 me-2 shadow-sm">
                    <i class="bi bi-shop-window text-white fs-4"></i>
                </div>
                <h4 class="fw-bold mb-0" style="color: var(--primary-blue);">GastoFacil</h4>
            </div>
        </div>

        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a class="nav-link" href="pedidos.html"><i class="bi bi-plus-circle"></i> Nuevo Pedido</a>
            <a class="nav-link active" href="historial.html"><i class="bi bi-journal-text-fill"></i> Historial</a>
            <a class="nav-link" href="proveedores.html"><i class="bi bi-people"></i> Proveedores</a>
            <a class="nav-link" href="reportes.html"><i class="bi bi-bar-chart-line"></i> Reportes</a>
        </nav>

        <div class="mt-auto pb-4">
            <a class="nav-link text-danger" href="javascript:void(0)" id="btnCerrarSesion">
                <i class="bi bi-box-arrow-left"></i> Cerrar sesión
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Historial de Pedidos</h2>
                <p class="text-muted mb-0">Administra y revisa los registros de tus compras.</p>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <a href="pedidos.html" class="btn-header-gradient text-decoration-none">
                    <i class="bi bi-plus-lg"></i> Nuevo Registro
                </a>
                <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle theme">
                    <i class="bi bi-sun-fill"></i>
                </button>
            </div>
        </header>

        <!-- Barra de Búsqueda -->
        <div class="d-flex gap-3 mb-4 flex-wrap">
            <div class="search-input-group flex-grow-1">
                <i class="bi bi-search"></i>
                <input type="text" id="inputBuscarHistorial" class="form-control"
                    placeholder="Buscar pedido por proveedor o fecha...">
            </div>
        </div>

        <!-- Área Dinámica Principal: Se reemplazará con la tabla si existen pedidos -->
        <div id="areaContenido">
            <div id="emptyState" class="card border-0 shadow-sm p-5 text-center" style="border-radius: 20px; background: var(--bg-card);">
                <div class="mb-4">
                    <svg class="clipboard-bag-svg" width="220" height="150" viewBox="0 0 220 150" fill="none"
                        xmlns="http://www.w3.org/2000/svg" style="display: block; margin: 0 auto;">
                        <path d="M40 30 L42 35 L47 37 L42 39 L40 44 L38 39 L33 37 L38 35 Z" fill="#93C5FD" opacity="0.6" />
                        <path d="M185 80 L186.5 83.5 L190 85 L186.5 86.5 L185 90 L183.5 86.5 L180 85 L183.5 83.5 Z"
                            fill="#93C5FD" opacity="0.5" />
                        <circle cx="140" cy="40" r="3" fill="#93C5FD" opacity="0.4" />
                        <circle cx="65" cy="115" r="4" fill="#93C5FD" opacity="0.4" />
                        <circle cx="110" cy="75" r="55" fill="#EFF6FF" />
                        <g class="bag-group" transform="translate(10, 0)">
                            <path d="M125 72 C125 55 140 55 140 72" stroke="#60A5FA" stroke-width="2.5"
                                stroke-linecap="round" />
                            <path
                                d="M115 72 C115 70 117 68 120 68 H145 C148 68 150 70 150 72 L153 110 C153 113 151 115 148 115 H117 C114 115 112 113 112 110 Z"
                                fill="#93C5FD" stroke="#3B82F6" stroke-width="1.5" />
                        </g>
                        <g class="clipboard-group" transform="translate(-10, 0)">
                            <rect x="85" y="45" width="55" height="75" rx="8" fill="#3B82F6" />
                            <rect x="90" y="52" width="45" height="63" rx="4" fill="#FFFFFF" />
                            <path d="M102 40 C102 38 104 36 107 36 H118 C121 36 123 38 123 40 V45 H102 Z" fill="#93C5FD" />
                            <rect x="108" y="38" width="9" height="3" rx="1.5" fill="#3B82F6" />
                            <circle cx="106" cy="65" r="1.5" fill="#1D4ED8" />
                            <circle cx="119" cy="65" r="1.5" fill="#1D4ED8" />
                            <path d="M109 72 Q112.5 76 116 72" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" />
                            <line x1="98" y1="84" x2="127" y2="84" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
                            <line x1="98" y1="92" x2="127" y2="92" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
                            <line x1="98" y1="100" x2="118" y2="100" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
                        </g>
                    </svg>
                </div>
                <h4 class="fw-bold text-dark mt-2 mb-2" style="font-size: 1.4rem;">Sin movimientos registrados</h4>
                <p class="text-muted mb-4" style="font-size: 0.95rem;">Aún no hay pedidos en el historial.</p>

                <div class="d-flex justify-content-center mb-3">
                    <a href="pedidos.html" class="btn btn-outline-primary rounded-pill px-4 py-2 text-decoration-none fw-semibold">
                        <i class="bi bi-plus-lg me-1"></i> Registrar mi primer pedido
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Editar Pedido -->
    <div class="modal fade" id="modalEditarPedido" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg" style="border-radius: 16px;">
                <div class="modal-header border-0">
                    <h5 class="fw-bold">Editar Registro de Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarPedido">
                        <input type="hidden" id="editIdPedido">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Proveedor *</label>
                            <select id="editSelectProveedor" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha de Compra *</label>
                            <input type="date" id="editFecha" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Resumen / Detalle</label>
                            <input type="text" id="editDescripcion" class="form-control" placeholder="Ej: 1x Cerveza">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Método de Pago</label>
                            <select id="editMetodo" class="form-select">
                                <option value="Efectivo">Efectivo</option>
                                <option value="Transferencia">Transferencia</option>
                                <option value="Crédito">Crédito</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Valor Total ($) *</label>
                            <input type="number" step="0.01" id="editValorTotal" class="form-control" required>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" id="btnGuardarEdit" class="btn text-white py-3 fw-bold"
                                style="background: linear-gradient(90deg, #2F80ED 0%, #7F56D9 100%); border-radius: 12px; border: none;">
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="theme.js"></script>
    <script src="api.js"></script>

    <script>
        let listaPedidos = [];
        let listaProveedores = [];

        // Evento de cierre de sesión unificado con SweetAlert2
        document.getElementById('btnCerrarSesion').addEventListener('click', function (e) {
            e.preventDefault();
            Swal.fire({
                title: '¿Cerrar sesión?',
                text: 'Tendrás que ingresar tus credenciales nuevamente para acceder.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#4318FF',
                cancelButtonColor: '#8F9BBA',
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'Cancelar',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear();
                    sessionStorage.clear();
                    window.location.href = "index.html";
                }
            });
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await cargarProveedores();
            await cargarHistorialDirecto();
        });

        async function cargarProveedores() {
            try {
                if (typeof API !== 'undefined' && API.obtenerProveedores) {
                    listaProveedores = await API.obtenerProveedores();
                }
            } catch (e) { console.error('Error proveedores:', e); }
        }

        async function cargarHistorialDirecto() {
            try {
                const idTienda = localStorage.getItem('idTienda') || '1';
                const res = await fetch('http://localhost:8080/GastoFacilWeb/api/pedidos', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Usuario-Id': String(idTienda)
                    },
                    credentials: 'include'
                });

                if (res.ok) {
                    listaPedidos = await res.json();
                    renderizarInterface(listaPedidos);
                } else {
                    console.error('El servidor Java respondió con estado:', res.status);
                }
            } catch (error) {
                console.error('Error de red al conectar con /api/pedidos:', error);
            }
        }

        function renderizarInterface(pedidos) {
            const area = document.getElementById('areaContenido');

            if (!pedidos || !Array.isArray(pedidos) || pedidos.length === 0) {
                return;
            }

            const formatoMoneda = new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                maximumFractionDigits: 0
            });

            let filasHtml = '';
            pedidos.forEach(p => {
                const descSegura = p.descripcion ? p.descripcion.replace(/'/g, "\\'") : '';
                filasHtml += `
                    <tr>
                        <td class="fw-bold">#${p.idPedido}</td>
                        <td>${p.fecha || 'N/A'}</td>
                        <td class="fw-semibold text-primary">${p.proveedor}</td>
                        <td class="text-muted small">${p.descripcion || 'Sin detalle'}</td>
                        <td><span class="badge bg-light text-dark border">${p.metodoPago}</span></td>
                        <td class="fw-bold text-success">${formatoMoneda.format(p.valorTotal)}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary border-0 me-1" title="Editar" 
                                onclick="abrirModalEditarPedido(${p.idPedido}, ${p.idProveedor}, '${p.fecha}', '${descSegura}', '${p.metodoPago}', ${p.valorTotal})">
                                <i class="bi bi-pencil-fill"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger border-0" title="Eliminar" 
                                onclick="eliminarPedido(${p.idPedido})">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            area.innerHTML = `
                <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 20px; background: var(--bg-card);">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr class="text-muted small text-uppercase">
                                    <th># ID</th>
                                    <th>FECHA</th>
                                    <th>PROVEEDOR</th>
                                    <th>RESUMEN / DETALLE</th>
                                    <th>MÉTODO PAGO</th>
                                    <th>VALOR TOTAL</th>
                                    <th class="text-end">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${filasHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function abrirModalEditarPedido(id, idProv, fecha, desc, metodo, valorTotal) {
            document.getElementById('editIdPedido').value = id;
            document.getElementById('editFecha').value = fecha;
            document.getElementById('editDescripcion').value = desc;
            document.getElementById('editMetodo').value = metodo;
            document.getElementById('editValorTotal').value = valorTotal;

            const selectProv = document.getElementById('editSelectProveedor');
            selectProv.innerHTML = '';
            listaProveedores.forEach(p => {
                const idP = p.idProveedor || p.id_proveedor || p.id;
                const selected = idP == idProv ? 'selected' : '';
                selectProv.innerHTML += `<option value="${idP}" ${selected}>${p.nombre}</option>`;
            });

            const modalEl = document.getElementById('modalEditarPedido');
            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            modal.show();
        }

        document.getElementById('formEditarPedido').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                idPedido: parseInt(document.getElementById('editIdPedido').value),
                idProveedor: parseInt(document.getElementById('editSelectProveedor').value),
                fecha: document.getElementById('editFecha').value,
                descripcion: document.getElementById('editDescripcion').value.trim(),
                metodoPago: document.getElementById('editMetodo').value,
                valorTotal: parseFloat(document.getElementById('editValorTotal').value)
            };

            try {
                const res = await fetch('http://localhost:8080/GastoFacilWeb/api/pedidos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Usuario-Id': localStorage.getItem('idTienda') || '1'
                    },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Actualizado!',
                        text: 'El pedido fue modificado correctamente.',
                        timer: 1500,
                        showConfirmButton: false
                    });

                    const modalEl = document.getElementById('modalEditarPedido');
                    const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                    modal.hide();

                    cargarHistorialDirecto();
                }
            } catch (err) {
                Swal.fire('Error', 'No se pudo actualizar el registro', 'error');
            }
        });

        async function eliminarPedido(id) {
            const confirmacion = await Swal.fire({
                title: '¿Eliminar este pedido?',
                text: "Esta acción descontará el monto del Dashboard inmediatamente.",
                icon: 'warning',
                showCancelButton: true,
                confirmColor: '#d33',
                cancelColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (confirmacion.isConfirmed) {
                try {
                    const res = await fetch(`http://localhost:8080/GastoFacilWeb/api/pedidos?id=${id}`, {
                        method: 'DELETE',
                        headers: {
                            'X-Usuario-Id': localStorage.getItem('idTienda') || '1'
                        },
                        credentials: 'include'
                    });

                    if (res.ok) {
                        Swal.fire('Eliminado', 'El pedido fue eliminado del historial.', 'success');
                        cargarHistorialDirecto();
                    }
                } catch (err) {
                    Swal.fire('Error', 'No se pudo eliminar el registro', 'error');
                }
            }
        }

        document.getElementById('inputBuscarHistorial').addEventListener('input', (e) => {
            const busqueda = e.target.value.toLowerCase();
            const filtrados = listaPedidos.filter(p =>
                (p.proveedor && p.proveedor.toLowerCase().includes(busqueda)) ||
                (p.descripcion && p.descripcion.toLowerCase().includes(busqueda)) ||
                (p.fecha && p.fecha.includes(busqueda))
            );
            renderizarInterface(filtrados);
        });
    </script>
</body>

</html>
