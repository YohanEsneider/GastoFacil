<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastoFacil - Directorio de Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=5">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>

    <aside class="sidebar">
        <div class="p-4 mb-4">
            <div class="d-flex align-items-center">
                <div class="bg-primary p-2 rounded-3 me-2 shadow-sm"><i class="bi bi-shop-window text-white fs-4"></i></div>
                <h4 class="fw-bold mb-0" style="color: var(--primary-blue);">GastoFacil</h4>
            </div>
        </div>

        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a class="nav-link" href="pedidos.html"><i class="bi bi-plus-circle"></i> Nuevo Pedido</a>
            <a class="nav-link" href="historial.html"><i class="bi bi-journal-text"></i> Historial</a>
            <a class="nav-link active" href="proveedores.html"><i class="bi bi-people-fill"></i> Proveedores</a>
            <a class="nav-link" href="reportes.html"><i class="bi bi-bar-chart-line"></i> Reportes</a>
        </nav>

        <div class="mt-auto pb-4">
            <a class="nav-link text-danger" href="javascript:void(0)" id="btnCerrarSesion">
                <i class="bi bi-box-arrow-left"></i> Cerrar sesión
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Directorio de Proveedores</h2>
                <p class="text-muted mb-0">Gestiona tus contactos y horarios de abastecimiento.</p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-primary fw-semibold px-4 py-2 shadow-sm rounded-3" onclick="abrirModalNuevo()">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo proveedor
                </button>
                <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle theme">
                    <i class="bi bi-sun-fill"></i>
                </button>
            </div>
        </header>

        <!-- Filtros y Búsqueda -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <div class="input-group shadow-sm rounded-3">
                    <span class="input-group-text bg-white border-0 ps-3"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="inputBuscar" class="form-control border-0 py-2.5 ps-2" placeholder="Buscar proveedor por nombre o teléfono..." onkeyup="filtrarProveedores()">
                </div>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <span class="text-muted fw-semibold" id="txtTotalProveedores"><i class="bi bi-people me-1"></i> 0 proveedores</span>
            </div>
        </div>

        <!-- Grid de Tarjetas de Proveedores -->
        <div class="row g-4" id="containerProveedores">
            <!-- Carga dinámica -->
        </div>
    </main>

    <!-- Modal Formulario Proveedor -->
    <div class="modal fade" id="modalProveedor" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold modal-title" id="lblModalTitulo">Registrar Proveedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formProveedor">
                        <input type="hidden" id="provId" value="0">

                        <div class="mb-3">
                            <label class="form-label text-uppercase small fw-bold text-muted">NOMBRE DEL PROVEEDOR / EMPRESA *</label>
                            <input type="text" id="provNombre" class="form-control py-2" placeholder="Ej: Bebidas del Valle" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-uppercase small fw-bold text-muted">TELÉFONO DE CONTACTO</label>
                            <input type="tel" id="provTelefono" class="form-control py-2" placeholder="Ej: 3155554433">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-uppercase small fw-bold text-muted">CATEGORÍA</label>
                            <select id="provCategoria" class="form-select py-2">
                                <option value="Bebidas">Bebidas</option>
                                <option value="Lácteos">Lácteos</option>
                                <option value="Abarrotes">Abarrotes</option>
                                <option value="Carnes y Embutidos">Carnes y Embutidos</option>
                                <option value="General" selected>General</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-uppercase small fw-bold text-muted">DÍAS DE VISITA / ABASTECIMIENTO</label>
                            <input type="text" id="provDiasVisita" class="form-control py-2" placeholder="Ej: Lunes y Jueves">
                        </div>

                        <div class="d-grid">
                            <button type="submit" id="btnGuardarProv" class="btn btn-primary py-2.5 fw-bold shadow-sm rounded-3">
                                Guardar Proveedor
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="theme.js"></script>
    <script src="api.js"></script>

    <script>
        let listaProveedoresGlobal = [];
        let modalBs = null;

        document.addEventListener('DOMContentLoaded', () => {
            modalBs = new bootstrap.Modal(document.getElementById('modalProveedor'));
            cargarProveedores();
        });

        document.getElementById('btnCerrarSesion').addEventListener('click', function (e) {
            e.preventDefault();
            Swal.fire({
                title: '¿Cerrar sesión?',
                text: 'Tendrás que ingresar tus credenciales nuevamente.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#4318FF',
                cancelButtonColor: '#8F9BBA',
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'Cancelar',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear();
                    sessionStorage.clear();
                    window.location.href = "index.html";
                }
            });
        });

        async function cargarProveedores() {
            try {
                listaProveedoresGlobal = await API.obtenerProveedores();
                renderizarProveedores(listaProveedoresGlobal);
            } catch (error) {
                console.error("Error al cargar proveedores:", error);
            }
        }

        function renderizarProveedores(lista) {
            const container = document.getElementById('containerProveedores');
            const txtTotal = document.getElementById('txtTotalProveedores');
            container.innerHTML = '';

            txtTotal.innerHTML = `<i class="bi bi-people me-1"></i> ${lista ? lista.length : 0} proveedores`;

            if (!lista || lista.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-people text-muted fs-1 d-block mb-2"></i>
                        <h5 class="text-muted fw-normal">No hay proveedores registrados.</h5>
                    </div>`;
                return;
            }

            lista.forEach(p => {
                const idProv = p.idProveedor || p.id_proveedor || p.id || 0;
                const nombre = p.nombre || 'Sin nombre';
                const telefono = p.telefono || 'Sin teléfono';
                const categoria = p.categoria || 'General';
                const diasVisita = p.diasVisita || p.dias_visita || 'No especificado';

                const cardHtml = `
                    <div class="col-md-6 col-lg-4">
                        <div class="card card-provider border-0 shadow-sm p-4 h-100 rounded-4">
                            <div class="d-flex align-items-center mb-3">
                                <div class="avatar-provider bg-light-blue p-3 rounded-circle me-3">
                                    <i class="bi bi-shop text-primary fs-4"></i>
                                </div>
                                <div>
                                    <h6 class="fw-bold mb-0 text-dark">${nombre}</h6>
                                    <span class="badge bg-light text-primary border mt-1">${categoria}</span>
                                </div>
                            </div>
                            <div class="small text-muted mb-3">
                                <div class="mb-1"><i class="bi bi-telephone me-2"></i>${telefono}</div>
                                <div><i class="bi bi-calendar-week me-2"></i>Visitas: <strong>${diasVisita}</strong></div>
                            </div>
                            <div class="d-flex gap-2 mt-auto pt-2 border-top">
                                <button class="btn btn-sm btn-outline-primary flex-fill fw-semibold rounded-2" onclick="abrirModalEditar(${idProv})">
                                    <i class="bi bi-pencil me-1"></i> Editar
                                </button>
                                <button class="btn btn-sm btn-outline-danger flex-fill fw-semibold rounded-2" onclick="confirmarEliminar(${idProv})">
                                    <i class="bi bi-trash me-1"></i> Eliminar
                                </button>
                            </div>
                        </div>
                    </div>`;
                container.innerHTML += cardHtml;
            });
        }

        function filtrarProveedores() {
            const query = document.getElementById('inputBuscar').value.toLowerCase().trim();
            const filtrados = listaProveedoresGlobal.filter(p => 
                (p.nombre && p.nombre.toLowerCase().includes(query)) ||
                (p.telefono && p.telefono.toLowerCase().includes(query))
            );
            renderizarProveedores(filtrados);
        }

        function abrirModalNuevo() {
            document.getElementById('formProveedor').reset();
            document.getElementById('provId').value = "0";
            document.getElementById('lblModalTitulo').innerText = "Registrar Proveedor";
            modalBs.show();
        }

        function abrirModalEditar(id) {
            if (!id || id === 0) return;

            const prov = listaProveedoresGlobal.find(p => 
                p.idProveedor == id || p.id_proveedor == id || p.id == id
            );
            if (!prov) return;

            document.getElementById('provId').value = id;
            document.getElementById('provNombre').value = prov.nombre || '';
            document.getElementById('provTelefono').value = prov.telefono || '';
            document.getElementById('provCategoria').value = prov.categoria || 'General';
            document.getElementById('provDiasVisita').value = prov.diasVisita || prov.dias_visita || '';
            
            document.getElementById('lblModalTitulo').innerText = "Editar Proveedor";
            modalBs.show();
        }

        document.getElementById('formProveedor').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('btnGuardarProv');
            btn.disabled = true;

            const idStr = document.getElementById('provId').value;
            const idVal = (idStr && idStr !== "null" && idStr !== "undefined") ? parseInt(idStr) : 0;

            const payload = {
                idProveedor: idVal,
                id_proveedor: idVal,
                id: idVal,
                nombre: document.getElementById('provNombre').value.trim(),
                telefono: document.getElementById('provTelefono').value.trim(),
                categoria: document.getElementById('provCategoria').value,
                diasVisita: document.getElementById('provDiasVisita').value.trim()
            };

            try {
                const res = await API.guardarProveedor(payload);

                if (res && (res.estatus === "Exitoso" || res.status === "OK")) {
                    modalBs.hide();
                    Swal.fire({
                        icon: 'success',
                        title: idVal === 0 ? '¡Proveedor Creado!' : '¡Proveedor Actualizado!',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    cargarProveedores();
                } else {
                    Swal.fire('Error', res.mensaje || 'No se pudo guardar el proveedor', 'error');
                }
            } catch (err) {
                console.error("Error al guardar proveedor:", err);
                Swal.fire('Error', 'Error de conexión con el servidor Java', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        async function confirmarEliminar(id) {
            if (!id || id === 0) {
                Swal.fire('Error', 'ID de proveedor inválido para eliminar', 'error');
                return;
            }

            const result = await Swal.fire({
                title: '¿Eliminar proveedor?',
                text: 'Esta acción verificará si el proveedor tiene pedidos activos.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#8F9BBA',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (result.isConfirmed) {
                try {
                    const res = await API.eliminarProveedor(id);
                    if (res && (res.estatus === "Exitoso" || res.status === "OK")) {
                        Swal.fire('Eliminado', 'Proveedor eliminado con éxito.', 'success');
                        cargarProveedores();
                    } else {
                        Swal.fire('No permitido', res.mensaje || 'No se pudo eliminar el proveedor.', 'warning');
                    }
                } catch (e) {
                    Swal.fire('Error', 'No se pudo completar la operación.', 'error');
                }
            }
        }
    </script>
</body>

</html>
