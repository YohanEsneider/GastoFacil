<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastoFacil - Directorio de Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>

    <aside class="sidebar">
        <div class="p-4 mb-4">
            <div class="d-flex align-items-center">
                <div class="bg-primary p-2 rounded-3 me-2 shadow-sm"><i class="bi bi-shop-window text-white fs-4"></i>
                </div>
                <h4 class="fw-bold mb-0" style="color: var(--primary-blue);">GastoFacil</h4>
            </div>
        </div>

        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a class="nav-link" href="pedidos.html"><i class="bi bi-plus-circle"></i> Nuevo Pedido</a>
            <a class="nav-link" href="historial.html"><i class="bi bi-journal-text"></i> Historial</a>
            <a class="nav-link active" href="proveedores.html"><i class="bi bi-people-fill"></i> Proveedores</a>
            <a class="nav-link" href="reportes.html"><i class="bi bi-bar-chart-line"></i> Reportes</a>
        </nav>

        <div class="mt-auto pb-4">
            <a class="nav-link text-danger" href="javascript:void(0)" id="btnCerrarSesion">
                <i class="bi bi-box-arrow-left"></i> Cerrar sesión
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Directorio de Proveedores</h2>
                <p class="text-muted mb-0">Gestiona tus contactos y horarios de abastecimiento.</p>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <button class="btn-header-gradient" onclick="abrirModalCrear()">
                    <i class="bi bi-plus-lg"></i> Nuevo proveedor
                </button>
                <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle theme">
                    <i class="bi bi-sun-fill"></i>
                </button>
            </div>
        </header>

        <!-- Barra de Búsqueda -->
        <div class="d-flex gap-3 mb-4 flex-wrap">
            <div class="search-input-group flex-grow-1">
                <i class="bi bi-search"></i>
                <input type="text" id="inputBuscar" class="form-control"
                    placeholder="Buscar proveedor por nombre o teléfono...">
            </div>
        </div>

        <!-- Contenedor para la Cuadrícula de Tarjetas de Proveedores -->
        <div id="gridProveedores" class="row g-3 mb-4 d-none">
            <!-- Tarjetas dinámicas inyectadas por JS -->
        </div>

        <!-- Contenedor Estado Vacío -->
        <div id="emptyState" class="empty-container p-5" style="max-width: 700px;">
            <div class="mb-4">
                <svg class="shop-provider-svg" width="220" height="150" viewBox="0 0 220 150" fill="none"
                    xmlns="http://www.w3.org/2000/svg" style="display: block; margin: 0 auto;">
                    <circle cx="65" cy="85" r="4" fill="#93C5FD" opacity="0.3" />
                    <circle cx="185" cy="45" r="3" fill="#93C5FD" opacity="0.4" />
                    <circle cx="50" cy="40" r="5" fill="#EFF6FF" opacity="0.6" />
                    <circle cx="110" cy="75" r="55" fill="#EFF6FF" />
                    <g class="pin-group" transform="translate(48, 55)">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12C2 17.52 12 28 12 28C12 28 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 15C10.34 15 9 13.66 9 12C9 10.34 10.34 9 12 9C13.66 9 15 10.34 15 12C15 13.66 13.66 15 12 15Z"
                            fill="#C084FC" opacity="0.7" />
                    </g>
                    <g class="clock-group" transform="translate(135, 62)">
                        <circle cx="15" cy="15" r="14" stroke="#93C5FD" stroke-width="2" />
                        <path d="M15 5 V15 H22" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
                    </g>
                    <g class="tree-group" transform="translate(70, 75)">
                        <path d="M15 0 C25 0 28 15 28 25 C28 35 22 35 15 35 C8 35 2 35 2 25 C2 15 5 0 15 0 Z"
                            fill="#86EFAC" opacity="0.8" />
                        <rect x="13.5" y="32" width="3" height="12" fill="#93C5FD" />
                    </g>
                    <g class="shop-group" transform="translate(85, 60)">
                        <rect x="5" y="48" width="50" height="4" rx="1" fill="#3B82F6" />
                        <rect x="9" y="16" width="42" height="32" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" />
                        <path d="M5 16 L10 5 H50 L55 16 Z" fill="#3B82F6" />
                        <path d="M10 16 L13 5 H18 L15 16 Z" fill="#60A5FA" />
                        <path d="M22 16 L23 5 H28 L27 16 Z" fill="#60A5FA" />
                        <path d="M34 16 L33 5 H38 L39 16 Z" fill="#60A5FA" />
                        <path d="M46 16 L43 5 H48 L50 16 Z" fill="#60A5FA" />
                        <rect x="18" y="30" width="10" height="18" fill="#1D4ED8" />
                        <circle cx="21" cy="39" r="1" fill="#FBBF24" />
                        <rect x="34" y="30" width="12" height="10" fill="#93C5FD" stroke="#3B82F6" stroke-width="1.5" />
                        <line x1="40" y1="30" x2="40" y2="40" stroke="#3B82F6" stroke-width="1.5" />
                    </g>
                </svg>
            </div>
            <h4 class="fw-bold text-dark mt-4 mb-2" style="font-size: 1.4rem;">Aún no tienes proveedores</h4>
            <p class="text-muted mb-4" style="font-size: 0.95rem;">Agrega tus contactos para tener a la mano sus datos
                de abastecimiento.</p>
            <button class="btn-action-gradient px-4 py-3" onclick="abrirModalCrear()" style="border-radius: 50px;">
                <i class="bi bi-plus-lg me-2"></i> Agregar proveedor
            </button>
        </div>
    </main>

    <!-- Modal Registrar / Editar Proveedor -->
    <div class="modal fade" id="modalProveedor" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="fw-bold" id="modalTitulo">Registrar Proveedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formProveedor">
                        <!-- Campo Oculto para Guardar el ID en modo Edición -->
                        <input type="hidden" id="provId" value="">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre del Proveedor / Empresa *</label>
                            <input type="text" id="provNombre" class="form-control"
                                placeholder="Ej: Distribuidora Don Pedro" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Teléfono / WhatsApp (Opcional)</label>
                            <input type="tel" id="provTelefono" class="form-control" placeholder="300 000 0000">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-muted small">Categoría (Opcional)</label>
                                <input type="text" id="provCategoria" class="form-control" placeholder="Ej: Bebidas, Lácteos">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-muted small">Días de Visita (Opcional)</label>
                                <input type="text" id="provDiasVisita" class="form-control" placeholder="Ej: Lunes y Jueves">
                            </div>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" id="btnGuardarProv" class="btn btn-add-main py-3"
                                style="background: linear-gradient(90deg, #2F80ED 0%, #7F56D9 100%); color: white; border: none; border-radius: 12px; font-weight: 600;">
                                Guardar Proveedor
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="theme.js"></script>
    <script src="api.js"></script>

    <script>
        let listaProveedores = [];

        // Evento de cierre de sesión unificado con SweetAlert2
        document.getElementById('btnCerrarSesion').addEventListener('click', function (e) {
            e.preventDefault();
            Swal.fire({
                title: '¿Cerrar sesión?',
                text: 'Tendrás que ingresar tus credenciales nuevamente para acceder.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#4318FF',
                cancelButtonColor: '#8F9BBA',
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'Cancelar',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear();
                    sessionStorage.clear();
                    window.location.href = "index.html";
                }
            });
        });

        document.addEventListener('DOMContentLoaded', cargarProveedores);

        async function cargarProveedores() {
            try {
                listaProveedores = await API.obtenerProveedores();
                renderizarProveedores(listaProveedores);
            } catch (error) {
                console.error('Error cargando proveedores:', error);
            }
        }

        function renderizarProveedores(proveedores) {
            const grid = document.getElementById('gridProveedores');
            const emptyState = document.getElementById('emptyState');

            if (!grid || !emptyState) return;

            if (!proveedores || proveedores.length === 0) {
                grid.classList.add('d-none');
                emptyState.classList.remove('d-none');
                return;
            }

            emptyState.classList.add('d-none');
            grid.classList.remove('d-none');
            grid.innerHTML = '';

            proveedores.forEach(p => {
                grid.innerHTML += `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm border-0 p-3 position-relative" style="border-radius: 12px; background: var(--bg-card);">
                            
                            <!-- Botón Editar -->
                            <button class="btn btn-sm btn-outline-primary border-0 position-absolute top-0 end-0 m-2 rounded-circle" 
                                    title="Editar proveedor" 
                                    onclick="abrirModalEditar(${p.idProveedor}, '${escapeHtml(p.nombre)}', '${escapeHtml(p.telefono || '')}', '${escapeHtml(p.categoria || '')}', '${escapeHtml(p.diasVisita || '')}')">
                                <i class="bi bi-pencil-fill"></i>
                            </button>

                            <div class="d-flex align-items-center mb-2 pe-4">
                                <div class="bg-light-primary text-primary p-2 rounded-circle me-3">
                                    <i class="bi bi-building fs-4"></i>
                                </div>
                                <div>
                                    <h6 class="fw-bold mb-0">${p.nombre}</h6>
                                    <small class="text-muted">${p.categoria || 'General'}</small>
                                </div>
                            </div>
                            <hr class="my-2 text-muted opacity-25">
                            <div class="small text-muted">
                                <p class="mb-1"><i class="bi bi-telephone me-2"></i>${p.telefono || 'Sin teléfono'}</p>
                                <p class="mb-0"><i class="bi bi-calendar-event me-2"></i>Visitas: ${p.diasVisita || 'Por definir'}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function escapeHtml(text) {
            return String(text).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function abrirModalCrear() {
            document.getElementById('formProveedor').reset();
            document.getElementById('provId').value = '';
            document.getElementById('modalTitulo').textContent = 'Registrar Proveedor';
            
            const modalEl = document.getElementById('modalProveedor');
            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            modal.show();
        }

        function abrirModalEditar(id, nombre, telefono, categoria, diasVisita) {
            document.getElementById('provId').value = id;
            document.getElementById('provNombre').value = nombre;
            document.getElementById('provTelefono').value = telefono;
            document.getElementById('provCategoria').value = categoria;
            document.getElementById('provDiasVisita').value = diasVisita;
            
            document.getElementById('modalTitulo').textContent = 'Editar Proveedor';

            const modalEl = document.getElementById('modalProveedor');
            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            modal.show();
        }

        document.getElementById('inputBuscar').addEventListener('input', function (e) {
            const busqueda = e.target.value.toLowerCase();
            const filtrados = listaProveedores.filter(p =>
                p.nombre.toLowerCase().includes(busqueda) ||
                (p.telefono && p.telefono.includes(busqueda))
            );
            renderizarProveedores(filtrados);
        });

        document.getElementById('formProveedor').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = document.getElementById('btnGuardarProv');
            btn.disabled = true;

            const idVal = document.getElementById('provId').value.trim();
            const nombreVal = document.getElementById('provNombre').value.trim();
            const telVal = document.getElementById('provTelefono').value.trim();
            const catVal = document.getElementById('provCategoria').value.trim();
            const diasVal = document.getElementById('provDiasVisita').value.trim();

            const payload = {
                idProveedor: idVal ? parseInt(idVal) : 0,
                nombre: nombreVal,
                telefono: telVal,
                categoria: catVal,
                diasVisita: diasVal
            };

            try {
                const res = await fetch('http://localhost:8080/GastoFacilWeb/api/proveedores', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Usuario-Id': localStorage.getItem('idTienda') || '1'
                    },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok && data.estatus === "Exitoso") {
                    Swal.fire({
                        icon: 'success',
                        title: idVal ? '¡Actualizado!' : '¡Guardado!',
                        text: data.mensaje || 'Operación realizada correctamente.',
                        timer: 1500,
                        showConfirmButton: false
                    });

                    document.getElementById('formProveedor').reset();
                    const modalEl = document.getElementById('modalProveedor');
                    const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                    modal.hide();

                    cargarProveedores();
                } else {
                    Swal.fire('Error', data.mensaje || 'No se pudo guardar el proveedor', 'error');
                }
            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'Sin conexión con el servidor Java', 'error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
