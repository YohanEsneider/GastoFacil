<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastoFacil - Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Solución para permitir escritura en inputs en Electron */
        input, select, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
            pointer-events: auto !important;
            cursor: text !important;
        }
    </style>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>

<div class="position-absolute top-0 end-0 p-4">
    <button id="theme-toggle" class="btn-theme-toggle" aria-label="Toggle theme">
        <i class="bi bi-sun-fill"></i>
    </button>
</div>

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="login-card" style="max-width: 500px; width: 100%;">
        <div class="text-center mb-4">
            <div class="bg-primary d-inline-block p-3 rounded-4 mb-3 shadow-sm" style="background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-accent) 100%) !important;">
                <i class="bi bi-shop-window text-white fs-2"></i>
            </div>
            <h2 class="fw-bold text-dark mb-1">Únete a GastoFacil</h2>
            <p class="text-muted small">Crea tu cuenta para gestionar tu tienda</p>
        </div>

        <form id="formRegistro" onsubmit="registrarUsuario(event)">
            <div class="mb-3">
                <label for="name" class="form-label small fw-bold">Nombre de la Tienda / Encargado</label>
                <input type="text" id="name" class="form-control" placeholder="Ej. Tienda El Porvenir" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label small fw-bold">Correo electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-bold">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
                <div class="form-text small">
                    Usa al menos 6 caracteres con letras y números.
                </div>
            </div>

            <div class="form-check mb-4 mt-3">
                <input class="form-check-input" type="checkbox" id="terms" required style="border-radius: 4px;">
                <label class="form-check-label small text-muted" for="terms" style="font-weight: 400; padding-top: 2px;">
                    Acepto los <a href="#" class="text-decoration-none fw-bold" style="color: var(--primary-blue);">Términos y Condiciones</a>
                </label>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-action w-100 mb-3">
                Crear mi cuenta
            </button>
        </form>

        <div class="text-center mt-3">
            <p class="mb-0 text-muted small">¿Ya tienes una cuenta? 
                <a href="index.html" class="text-decoration-none fw-bold" style="color: var(--primary-blue);">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="theme.js"></script>

<script>
    async function registrarUsuario(e) {
        e.preventDefault();

        const nombre = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const terms = document.getElementById('terms').checked;

        if (!terms) {
            Swal.fire('Atención', 'Debes aceptar los términos y condiciones.', 'warning');
            return;
        }

        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registrando...';

        try {
            // Envío con el atributo usuario generado a partir del correo
            const res = await fetch('http://localhost:8080/GastoFacilWeb/api/registro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    nombre: nombre,
                    usuario: email.split('@')[0],
                    correo: email,
                    password: password
                })
            });

            const data = await res.json();

            if (res.ok || res.status === 201 || data.estatus === 'Exitoso') {
                await Swal.fire({
                    icon: 'success',
                    title: '¡Cuenta Creada!',
                    text: 'Tu registro ha sido exitoso. Ya puedes iniciar sesión.',
                    confirmButtonColor: '#4318FF'
                });
                window.location.href = 'index.html';
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Registro',
                    text: data.mensaje || 'No se pudo crear la cuenta.',
                    confirmButtonColor: '#4318FF'
                });
            }
        } catch (error) {
            console.error('Error al registrar usuario:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error de Conexión',
                text: 'No se pudo conectar con el servidor backend.',
                confirmButtonColor: '#4318FF'
            });
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = 'Crear mi cuenta';
        }
    }
</script>
</body>
</html>
